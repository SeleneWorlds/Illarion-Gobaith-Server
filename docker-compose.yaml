services:
  selene:
    image: 'docker.twelveiterations.com/seleneworlds/selene:main'
    ports:
      - '8147:8147'
    volumes:
      - ./bundles:/app/bundles
      - ./server.properties:/app/server.properties
      - ./script.properties:/app/script.properties
      - selene_save:/app/save

volumes:
  selene_save:
